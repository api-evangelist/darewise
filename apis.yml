  detail: >-
    Darewise ships a consumer game and nothing else — the legacy brand host www.darewise.com now
    refuses TCP on both 443 and 80 (its last Internet Archive capture serving HTTP 200 is
    2025-04-21), the live successor host www.lifebeyondstudios.com returns a real origin 404 for
    /llms.txt and for every /.well-known/* path while answering all HTML and API-shaped paths with a
    Cloudflare "Just a moment..." 403 interstitial, no api./docs./developer. subdomain resolves in
    DNS on either domain, and the studio's only first-party developer artifact anywhere is an
    unmaintained Apache-2.0 AsyncAPI generator template for Unreal Engine on npm (v0.1.3,
    2023-12-11) — a code generator, not an API.
