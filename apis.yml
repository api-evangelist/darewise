aid: darewise
name: Darewise
description: 'Darewise Entertainment is a European game studio founded by AAA industry veterans — game
  director Benjamin Charbit (Assassin''s Creed IV: Black Flag) and engine tech lead Samuel Kahn (Ubisoft
  Snowdrop, Crytek CryEngine) — with offices in Paris, London and Barcelona. It builds Life Beyond, a
  free-to-play sci-fi MMO on Unreal Engine 5 set on the alien world Dolos, combining Web3 asset ownership
  (NFTs and ERC-20 tokens) with player-driven settlement and governance. Animoca Brands announced the
  acquisition of a majority stake in April 2022, and the studio now trades as Life Beyond Studios. The
  original darewise.com website last served content in April 2025 and the host now refuses TCP
  connections on 80 and 443. Darewise publishes no API, developer portal, or API documentation of any
  kind; the only machine-readable developer artifact it has ever released publicly is an open-source
  AsyncAPI generator template that emits Unreal Engine C++ from an AsyncAPI 3.x document, published to
  npm under its own scope.'
