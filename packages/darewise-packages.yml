note: >-
  Darewise ships NO client SDK, because it ships no API. The single first-party package it has
  published to any public registry is developer TOOLING — an AsyncAPI generator template that emits
  Unreal Engine C++ from an AsyncAPI 3.x document. It is catalogued here because it is real,
  first-party and dated, but it is deliberately NOT wired as an `SDKs` pointer: it is not a client
  library for a Darewise API, and counting it as one would credit the studio with an SDK surface it
  does not have. Registries searched with no first-party result: PyPI, RubyGems, crates.io, NuGet,
  Maven Central, pkg.go.dev, Packagist.
